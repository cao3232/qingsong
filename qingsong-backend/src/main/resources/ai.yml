  cloud:
    # 已引入 spring-ai-alibaba-starter-a2a-nacos / config-nacos，
    # 若未部署 Nacos 服务端请保持如下停用，避免启动时尝试连接。
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    discovery:
      enabled: false
